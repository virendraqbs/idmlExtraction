<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CL Pipeline — Edit Topic</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --primary: #7c3aed; }
  body { background: #f8f9fc; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  .navbar-custom { background: #fff; border-bottom: 1px solid #e5e7eb; }
  .navbar-custom .navbar-brand { font-weight: 700; font-size: 20px; }
  .navbar-custom .navbar-brand span { color: var(--primary); }
  .navbar-custom .nav-link { color: #374151; padding: 0.35rem 0.6rem; border-radius: 6px; }
  .navbar-custom .nav-link:hover { color: var(--primary); background: rgba(124,58,237,0.08); }
  .navbar-custom .nav-link.active { color: var(--primary); font-weight: 600; }
  .page { max-width: 720px; margin: 0 auto; padding: 28px 24px; }
  .form-card { background: #fff; border: 1px solid #e8eaf0; border-radius: 14px; padding: 28px 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
</style>
</head>
<body>
<nav class="navbar navbar-expand navbar-custom sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/dashboard">CL <span>Pipeline</span></a>
    <div class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
      <a class="nav-link" href="/dashboard" style="font-size:14px">Dashboard</a>
      <a class="nav-link" href="/modules" style="font-size:14px">Module Management</a>
      <a class="nav-link active" href="/topics" style="font-size:14px">Topic Management</a>
      <a class="nav-link" href="/browse" style="font-size:14px">Browse All</a>
    </div>
    <div class="d-flex align-items-center gap-3">
      {% if session %}<span class="text-muted" style="font-size:13px">{{ session.username }}</span>{% endif %}
      <a href="/topics" class="btn btn-outline-secondary btn-sm">← Back to list</a>
      <a href="/logout" class="btn btn-outline-secondary btn-sm">Sign Out</a>
    </div>
  </div>
</nav>
<div class="page">
  <div class="mb-4">
    <nav aria-label="breadcrumb"><ol class="breadcrumb" style="font-size:13px"><li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li><li class="breadcrumb-item"><a href="/topics">Topic Management</a></li><li class="breadcrumb-item active">Edit Topic</li></ol></nav>
    <h4 class="fw-bold">Edit Topic</h4>
  </div>
  <div class="form-card">
    <form method="POST" action="/topics/{{ topic.id }}/edit" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Module</label>
        <select name="module_id" class="form-select">
          <option value="">— Select module —</option>
          {% for m in modules %}
          <option value="{{ m.id }}" {% if current_module_id == m.id %}selected{% endif %}>{{ m.title or m.id }}{% if m.module_number %} (Module {{ m.module_number }}){% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" value="{{ topic.title or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Topic number</label>
        <input type="number" name="topic_number" class="form-control" value="{{ topic.topic_number or '' }}" min="1">
      </div>
      <div class="mb-3">
        <label class="form-label">Topic summary</label>
        <textarea name="topic_summary" class="form-control" rows="3">{{ topic.topic_summary or '' }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="background:var(--primary);border-color:var(--primary)">Save</button>
    </form>
  </div>
</div>
</body>
</html>
