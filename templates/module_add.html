<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Module — CL Pipeline</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --primary: #7c3aed; }
  body { background: #f8f9fc; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  .navbar-custom { background: #fff; border-bottom: 1px solid #e5e7eb; }
  .navbar-custom .navbar-brand { font-weight: 700; font-size: 20px; }
  .navbar-custom .navbar-brand span { color: var(--primary); }
  .page { max-width: 640px; margin: 0 auto; padding: 28px 24px; }
  .card-add { background: #fff; border-radius: 14px; border: 1px solid #e8eaf0; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 28px 32px; }
  .drop-zone { border: 2px dashed #d1d5db; border-radius: 12px; padding: 36px 24px; text-align: center; cursor: pointer; position: relative; background: #fafbfc; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--primary); background: rgba(124,58,237,0.06); }
  .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 2; width: 100%; height: 100%; }
  .btn-submit { background: linear-gradient(135deg, var(--primary) 0%, #6d28d9 100%); color: #fff; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; }
  .btn-submit:hover { color: #fff; opacity: 0.95; }
</style>
</head>
<body>
<nav class="navbar navbar-expand navbar-custom sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/dashboard">CL <span>Pipeline</span></a>
    <div class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
      <a class="nav-link" href="/dashboard" style="font-size:14px">Dashboard</a>
      <a class="nav-link active" href="/modules" style="font-size:14px; font-weight:600">Module Management</a>
      <a class="nav-link" href="/topics" style="font-size:14px">Topic Management</a>
      <a class="nav-link" href="/browse" style="font-size:14px">Browse All</a>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span class="text-muted" style="font-size:13px">{{ session.username }}</span>
      <a href="/logout" class="btn btn-outline-secondary btn-sm">Sign Out</a>
    </div>
  </div>
</nav>

<div class="page">
  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <div class="card card-add">
    <h5 class="mb-3">Add Module</h5>
    <p class="text-muted small mb-4">Upload a PDF. The module title will be taken from the filename.</p>
    <form method="POST" action="/modules/add" enctype="multipart/form-data">
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('pdf-input').click()">
        <input type="file" name="pdf_file" id="pdf-input" accept=".pdf" required>
        <div class="mb-2" style="font-size:28px">&#128196;</div>
        <div class="fw-semibold text-dark">Drop PDF here or click to browse</div>
        <div class="small text-muted">PDF only, up to 100 MB</div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-submit">Save Module</button>
        <a href="/modules" class="btn btn-outline-secondary ms-2">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  var dz = document.getElementById('drop-zone');
  var inp = document.getElementById('pdf-input');
  dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', function() { dz.classList.remove('dragover'); });
  dz.addEventListener('drop', function(e) { e.preventDefault(); dz.classList.remove('dragover'); if (e.dataTransfer.files.length) inp.files = e.dataTransfer.files; });
</script>
</body>
</html>
